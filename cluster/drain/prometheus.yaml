# Offline example. Replace file_sd inventories with explicitly approved lab nodes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - prometheus-rules.yaml
scrape_configs:
  - job_name: dcgm
    honor_labels: true
    file_sd_configs:
      - files: [dcgm-targets.json]
  - job_name: node
    honor_labels: true
    file_sd_configs:
      - files: [node-targets.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: node_network_carrier
        action: keep
  - job_name: training
    # Dedicated node_exporter textfile collector endpoint; one reporter per node.
    honor_labels: true
    file_sd_configs:
      - files: [training-targets.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: crucible_step_.*
        action: keep
