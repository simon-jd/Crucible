# Render site values with render.py. Requires identical pinned packages on all nodes.
ClusterName=crucible
SlurmctldHost=@CONTROLLER@
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SchedulerType=sched/backfill
GresTypes=gpu
ReturnToService=2
# Set CPUs/RealMemory from slurmd -C on target hardware, never guessed here.
NodeName=@NODES@ CPUs=@CPUS@ RealMemory=@MEMORY_MB@ Gres=gpu:h100:8 State=UNKNOWN
PartitionName=h100 Nodes=@NODES@ Default=YES MaxTime=02:00:00 State=UP OverSubscribe=NO
