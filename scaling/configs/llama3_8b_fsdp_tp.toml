# Candidate schema: TorchTitan v0.2.0 @ 29624e37fa6dd319fd671b009338651b5c665da2.
# Random-init Llama-3 8B training; tokenizer assets must be revision-pinned before launch.
[job]
dump_folder = "./artifacts/scaling"
description = "Llama3 8B FSDP2 TP2 strong scaling"

[model]
name = "llama3"
flavor = "8B"
hf_assets_path = "./assets/hf/Llama-3.1-8B"
converters = []

[training]
local_batch_size = 1
global_batch_size = 256
seq_len = 8192
steps = 200
seed = 42
dataset = "c4"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 50

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 2
pipeline_parallel_degree = 1
context_parallel_degree = 1
fsdp_reshard_after_forward = "always"

[metrics]
log_freq = 50
enable_tensorboard = false

[profiling]
enable_profiling = false

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[validation]
enable = false
