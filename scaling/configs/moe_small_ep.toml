# Candidate schema: TorchTitan v0.2.0 @ 29624e37fa6dd319fd671b009338651b5c665da2.
# Actual upstream DeepSeek debugmodel: 6 layers, dim256, 8 experts, top_k3, 2 shared.
[job]
dump_folder = "./artifacts/scaling"
description = "DeepSeek small MoE FSDP2 expert parallel all-to-all"

[model]
name = "deepseek_v3"
flavor = "debugmodel"
hf_assets_path = "./tests/assets/tokenizer"
converters = []

[training]
local_batch_size = 1
global_batch_size = 256
seq_len = 1024
steps = 200
seed = 42
dataset = "c4_test"
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 50

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1
expert_parallel_degree = 2
expert_tensor_parallel_degree = 1
fsdp_reshard_after_forward = "always"

[metrics]
log_freq = 50
enable_tensorboard = false

[profiling]
enable_profiling = false

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output", "router.gate"]

[validation]
enable = false
