# T15 phase 7: full-size EAGLE-3 draft for Qwen3-4B (SpecForge e3ab28d, offline, one RTX 4090).
# Draft: SpecForge's standard configs/qwen3-4b-eagle3.json unchanged (draft_vocab_size 32000,
# intermediate_size 9728; 218M trainable). Data: 60,480 UltraChat 200k train_sft conversations
# regenerated by Qwen3-4B itself (thinking off, greedy), in 105 equal batches of 576 rows.
# Features for all of them (about 1.07 TB at 17.6 MB/sample) cannot fit the 40 GB share, so
# spec/t15_cycle.py makes one batch's features, trains it as one epoch of this run (resumed
# from {run_id}-latest), deletes them, and repeats: num_epochs = 105, total_steps = 105 x 576.
# The vocab mapping is computed once over all regenerated data (spec/t15_vocab.py), because
# SpecForge would otherwise derive it from whichever feature batch is on disk.
# Paths are relative to the repo root.
model:
  target_model_path: /home/postedism/.cache/huggingface/hub/models--Qwen--Qwen3-4B/snapshots/1cfa9a7208912126459214e8b04321603b3df60c
  draft_model_config: spec/configs/qwen3-4b-eagle3.json
  vocab_mapping_path: .cache/t15/full/vocab.pt
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: .cache/t15/features-full
  max_length: 1024
  chat_template: qwen
  cache_dir: .cache/t15/sf-cache

training:
  strategy: eagle3
  num_epochs: 105
  total_steps: 60480
  batch_size: 1
  learning_rate: 1.0e-4
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: flex_attention
  save_interval: 0
  max_checkpoints: 1
  log_interval: 100
  dist_timeout: 20
  seed: 0

run_id: qwen3-4b-eagle3-t15-full
output_dir: .cache/t15/train-full

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
